[project]
name = "player-detect"
version = "0.1.0"
description = "Detección y seguimiento de jugadores en vídeos de fútbol sala"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]

[project.scripts]
player-detect = "player_detect.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-pyyaml>=6.0.12",
]
label = ["labelimg>=1.8.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/player_detect"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src", "scripts"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: requiere pesos descargados y ejecuta inferencia real"]
addopts = "-q"
